<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog Comment UI Repair V1 Comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 18px; background: #eaf0f7; color: #183361; font: 700 16px/1.3 Arial, sans-serif; }
      main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; height: calc(100vh - 36px); }
      figure { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; min-width: 0; margin: 0; }
      figcaption { padding: 8px 12px; border-radius: 7px; background: #fff; box-shadow: 0 4px 18px rgba(35, 68, 112, .08); text-align: center; }
      img { width: 100%; height: 100%; border: 1px solid #dce6f2; border-radius: 8px; background: #fff; object-fit: contain; object-position: top center; box-shadow: 0 8px 24px rgba(35, 68, 112, .1); }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>REFERENCE</figcaption><img src="reference.png" alt="Reference" /></figure>
      <figure><figcaption>BEFORE</figcaption><img src="before-desktop-1484x1060.png" alt="Before" /></figure>
      <figure><figcaption>AFTER</figcaption><img src="after-desktop-1484x1060.png" alt="After" /></figure>
    </main>
  </body>
</html>
