name: ${OJPLATFORM_COMPOSE_PROJECT_NAME:-ojplatform-infra}

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ojplatform}
      POSTGRES_USER: ${POSTGRES_USER:-ojplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PRODUCT_RUNTIME_DB_USER: ${PRODUCT_RUNTIME_DB_USER:-ojplatform_runtime}
      PRODUCT_RUNTIME_DB_PASSWORD: ${PRODUCT_RUNTIME_DB_PASSWORD:-change-me-runtime}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/docker/init-product-runtime-role.sh:/docker-entrypoint-initdb.d/10-product-runtime-role.sh:ro
    networks: [infrastructure]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis-acl-bootstrap:
    image: redis:7.4.1-alpine
    entrypoint: ['/bin/sh', '/opt/ojplatform/bootstrap-redis-acl.sh']
    environment:
      REDIS_ADMIN_USERNAME: ${REDIS_ADMIN_USERNAME:-oj-admin}
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:-dev-only-redis-admin}
      REDIS_PRODUCT_USERNAME: ${REDIS_PRODUCT_USERNAME:-oj-product}
      REDIS_PRODUCT_PASSWORD: ${REDIS_PRODUCT_PASSWORD:-dev-only-redis-product}
      REDIS_JUDGE_USERNAME: ${REDIS_JUDGE_USERNAME:-oj-judge-service}
      REDIS_JUDGE_PASSWORD: ${REDIS_JUDGE_PASSWORD:-dev-only-redis-judge}
      REDIS_WORKER_USERNAME: ${REDIS_WORKER_USERNAME:-oj-judge-worker}
      REDIS_WORKER_PASSWORD: ${REDIS_WORKER_PASSWORD:-dev-only-redis-worker}
      REDIS_HEALTH_USERNAME: ${REDIS_HEALTH_USERNAME:-oj-redis-health}
      REDIS_HEALTH_PASSWORD: ${REDIS_HEALTH_PASSWORD:-dev-only-redis-health}
      JUDGE_REDIS_PREFIX: ${JUDGE_REDIS_PREFIX:-oj:judge-service}
    volumes:
      - redis-acl:/redis-acl
      - ./deploy/docker/bootstrap-redis-acl.sh:/opt/ojplatform/bootstrap-redis-acl.sh:ro
    restart: 'no'

  redis:
    image: redis:7.4.1-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--aclfile',
        '/etc/redis-acl/users.acl',
      ]
    environment:
      REDIS_HEALTH_USERNAME: ${REDIS_HEALTH_USERNAME:-oj-redis-health}
      REDIS_HEALTH_PASSWORD: ${REDIS_HEALTH_PASSWORD:-dev-only-redis-health}
    volumes:
      - redis-data:/data
      - redis-acl:/etc/redis-acl:ro
    depends_on:
      redis-acl-bootstrap:
        condition: service_completed_successfully
    networks: [infrastructure, judge-host]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$REDIS_HEALTH_PASSWORD" redis-cli --user "$$REDIS_HEALTH_USERNAME" ping | grep -qx PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ojplatform}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    volumes:
      - minio-data:/data
    networks: [infrastructure]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio-bootstrap:
    image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null; do sleep 1; done
        mc mb --ignore-existing "local/$${S3_BUCKET}" >/dev/null
        mc admin user add local "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" >/dev/null
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::%s","arn:aws:s3:::%s/*"]}]}' "$${S3_BUCKET}" "$${S3_BUCKET}" > /tmp/product-policy.json
        mc admin policy create local ojplatform-product /tmp/product-policy.json >/dev/null
        mc admin policy attach local ojplatform-product --user "$${S3_ACCESS_KEY}" >/dev/null
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ojplatform}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ojplatform-product}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-product-s3}
      S3_BUCKET: ${S3_BUCKET:-ojplatform-api}
    depends_on:
      minio:
        condition: service_healthy
    networks: [infrastructure]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: 'no'

  migrate-product:
    image: ${OJPLATFORM_API_IMAGE:-ojplatform/api:dev}
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ['node', 'scripts/migrate.mjs', 'up']
    environment:
      DATABASE_URL: ${PRODUCT_MIGRATION_DATABASE_URL:-postgres://ojplatform:change-me@postgres:5432/ojplatform}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [infrastructure]
    restart: 'no'

  api:
    image: ${OJPLATFORM_API_IMAGE:-ojplatform/api:dev}
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3010'
      OJPLATFORM_INFRA: 'true'
      DATABASE_URL: ${PRODUCT_RUNTIME_DATABASE_URL:-postgres://ojplatform_runtime:change-me-runtime@postgres:5432/ojplatform}
      REDIS_URL: redis://${REDIS_PRODUCT_USERNAME:-oj-product}:${REDIS_PRODUCT_PASSWORD:-dev-only-redis-product}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ojplatform}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-minio}
      S3_BUCKET: ${S3_BUCKET:-ojplatform-api}
      JUDGE_SERVICE_URL: ${JUDGE_SERVICE_INTERNAL_URL:-http://judge-service:3100}
      JUDGE_SERVICE_TOKEN: ${JUDGE_SERVICE_TOKEN:-}
      JUDGE_ARTIFACT_READ_TOKEN: ${JUDGE_ARTIFACT_READ_TOKEN:-}
      REAL_SUBMISSION_EXECUTION: ${REAL_SUBMISSION_EXECUTION:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      migrate-product:
        condition: service_completed_successfully
    networks: [infrastructure, judge-host]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3010/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    image: ${OJPLATFORM_WEB_IMAGE:-ojplatform/web:dev}
    build:
      context: .
      dockerfile: Dockerfile.web
      additional_contexts:
        # Only the Web image consumes this. It defaults to the repository-local
        # plugin checkout so Core/Judge-only Compose operations never require a
        # plugin path. Override it when the checkout lives elsewhere.
        online-code-editor: ${OJPLATFORM_ONLINE_CODE_EDITOR_CONTEXT:-./plugins/OnlineCodeEditor}
    depends_on:
      api:
        condition: service_healthy
    networks: [infrastructure, web-ingress]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  judge-bootstrap:
    image: ${OJPLATFORM_JUDGE_MIGRATION_IMAGE:-ojplatform/judge-migration:dev}
    build:
      context: .
      dockerfile: Dockerfile.judge-service
      target: migration
    command: ['node', 'scripts/judge-service-bootstrap.mjs']
    environment:
      JUDGE_DATABASE_ADMIN_URL: ${JUDGE_DATABASE_ADMIN_URL:-}
      JUDGE_DATABASE_NAME: ${JUDGE_DATABASE_NAME:-ojplatform_judge}
      JUDGE_DATABASE_ROLE: ${JUDGE_DATABASE_ROLE:-ojplatform_judge_runtime}
      JUDGE_DATABASE_PASSWORD: ${JUDGE_DATABASE_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [infrastructure]
    profiles: [judge]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: 'no'

  migrate-judge:
    image: ${OJPLATFORM_JUDGE_MIGRATION_IMAGE:-ojplatform/judge-migration:dev}
    build:
      context: .
      dockerfile: Dockerfile.judge-service
      target: migration
    command: ['node', 'scripts/judge-service-migrate.mjs', 'up']
    environment:
      JUDGE_DATABASE_URL: ${JUDGE_MIGRATION_DATABASE_URL:-}
      JUDGE_DATABASE_ROLE: ${JUDGE_DATABASE_ROLE:-ojplatform_judge_runtime}
    depends_on:
      judge-bootstrap:
        condition: service_completed_successfully
    networks: [infrastructure]
    profiles: [judge]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: 'no'

  judge-service:
    image: ${OJPLATFORM_JUDGE_SERVICE_IMAGE:-ojplatform/judge-service:dev}
    build:
      context: .
      dockerfile: Dockerfile.judge-service
      target: runtime
    environment:
      NODE_ENV: production
      JUDGE_SERVICE_HOST: 0.0.0.0
      JUDGE_SERVICE_PORT: '3100'
      JUDGE_DATABASE_URL: ${JUDGE_RUNTIME_DATABASE_URL:-}
      JUDGE_REDIS_URL: redis://${REDIS_JUDGE_USERNAME:-oj-judge-service}:${REDIS_JUDGE_PASSWORD:-dev-only-redis-judge}@redis:6379/0
      JUDGE_REDIS_PREFIX: ${JUDGE_REDIS_PREFIX:-oj:judge-service}
      JUDGE_SERVICE_TOKEN: ${JUDGE_SERVICE_TOKEN:-}
      JUDGE_NODE_TOKEN: ${JUDGE_NODE_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
      migrate-judge:
        condition: service_completed_successfully
    networks: [infrastructure, judge-host]
    profiles: [judge]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

networks:
  infrastructure:
    internal: true
  judge-host:
  web-ingress:

volumes:
  postgres-data:
  redis-data:
  redis-acl:
  minio-data:
