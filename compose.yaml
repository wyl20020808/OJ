name: ${OJPLATFORM_COMPOSE_PROJECT_NAME:-ojplatform-infra}

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ojplatform}
      POSTGRES_USER: ${POSTGRES_USER:-ojplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PRODUCT_RUNTIME_DB_USER: ${PRODUCT_RUNTIME_DB_USER:-ojplatform_runtime}
      PRODUCT_RUNTIME_DB_PASSWORD: ${PRODUCT_RUNTIME_DB_PASSWORD:-change-me-runtime}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/docker/init-product-runtime-role.sh:/docker-entrypoint-initdb.d/10-product-runtime-role.sh:ro
    networks: [infrastructure]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7.4.1-alpine
    networks: [infrastructure]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ojplatform}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    volumes:
      - minio-data:/data
    networks: [infrastructure]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate-product:
    image: ${OJPLATFORM_API_IMAGE:-ojplatform/api:dev}
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ['node', 'scripts/migrate.mjs', 'up']
    environment:
      DATABASE_URL: ${PRODUCT_MIGRATION_DATABASE_URL:-postgres://ojplatform:change-me@postgres:5432/ojplatform}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [infrastructure]
    restart: 'no'

  api:
    image: ${OJPLATFORM_API_IMAGE:-ojplatform/api:dev}
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3010'
      OJPLATFORM_INFRA: 'true'
      DATABASE_URL: ${PRODUCT_RUNTIME_DATABASE_URL:-postgres://ojplatform_runtime:change-me-runtime@postgres:5432/ojplatform}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ojplatform}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-minio}
      S3_BUCKET: ${S3_BUCKET:-ojplatform-api}
      JUDGE_SERVICE_URL: ${JUDGE_SERVICE_URL:-http://judge-service:3100}
      JUDGE_SERVICE_TOKEN: ${JUDGE_SERVICE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate-product:
        condition: service_completed_successfully
    networks: [infrastructure]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3010/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    image: ${OJPLATFORM_WEB_IMAGE:-ojplatform/web:dev}
    build:
      context: .
      dockerfile: Dockerfile.web
      additional_contexts:
        online-code-editor: ${OJPLATFORM_ONLINE_CODE_EDITOR_CONTEXT:?OJPLATFORM_ONLINE_CODE_EDITOR_CONTEXT must point to the OnlineCodeEditor checkout}
    depends_on:
      api:
        condition: service_healthy
    networks: [infrastructure, web-ingress]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  judge-bootstrap:
    image: ${OJPLATFORM_JUDGE_MIGRATION_IMAGE:-ojplatform/judge-migration:dev}
    build:
      context: .
      dockerfile: Dockerfile.judge-service
      target: migration
    command: ['node', 'scripts/judge-service-bootstrap.mjs']
    environment:
      JUDGE_DATABASE_ADMIN_URL: ${JUDGE_DATABASE_ADMIN_URL:-}
      JUDGE_DATABASE_NAME: ${JUDGE_DATABASE_NAME:-ojplatform_judge}
      JUDGE_DATABASE_ROLE: ${JUDGE_DATABASE_ROLE:-ojplatform_judge_runtime}
      JUDGE_DATABASE_PASSWORD: ${JUDGE_DATABASE_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [infrastructure]
    profiles: [judge]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: 'no'

  migrate-judge:
    image: ${OJPLATFORM_JUDGE_MIGRATION_IMAGE:-ojplatform/judge-migration:dev}
    build:
      context: .
      dockerfile: Dockerfile.judge-service
      target: migration
    command: ['node', 'scripts/judge-service-migrate.mjs', 'up']
    environment:
      JUDGE_DATABASE_URL: ${JUDGE_MIGRATION_DATABASE_URL:-}
      JUDGE_DATABASE_ROLE: ${JUDGE_DATABASE_ROLE:-ojplatform_judge_runtime}
    depends_on:
      judge-bootstrap:
        condition: service_completed_successfully
    networks: [infrastructure]
    profiles: [judge]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: 'no'

  judge-service:
    image: ${OJPLATFORM_JUDGE_SERVICE_IMAGE:-ojplatform/judge-service:dev}
    build:
      context: .
      dockerfile: Dockerfile.judge-service
      target: runtime
    environment:
      NODE_ENV: production
      JUDGE_SERVICE_HOST: 0.0.0.0
      JUDGE_SERVICE_PORT: '3100'
      JUDGE_DATABASE_URL: ${JUDGE_RUNTIME_DATABASE_URL:-}
      JUDGE_REDIS_URL: redis://redis:6379
      JUDGE_REDIS_PREFIX: ${JUDGE_REDIS_PREFIX:-oj:judge-service}
      JUDGE_SERVICE_TOKEN: ${JUDGE_SERVICE_TOKEN:-}
      JUDGE_NODE_TOKEN: ${JUDGE_NODE_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
      migrate-judge:
        condition: service_completed_successfully
    networks: [infrastructure, judge-host]
    profiles: [judge]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

networks:
  infrastructure:
    internal: true
  judge-host:
  web-ingress:

volumes:
  postgres-data:
  minio-data:
