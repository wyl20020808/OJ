name: ojplatform-local

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ojplatform
      POSTGRES_USER: ojplatform
      POSTGRES_PASSWORD: ojplatform_dev
    ports:
      - '55432:5432'
    volumes:
      - ojplatform-postgres-data:/var/lib/postgresql/data
    networks: [ojplatform-local]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ojplatform -d ojplatform']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.1-alpine
    ports:
      - '56379:6379'
    volumes:
      - ojplatform-redis-data:/data
    networks: [ojplatform-local]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ojplatform
      MINIO_ROOT_PASSWORD: ojplatform_dev_secret
    ports:
      - '59000:9000'
      - '59001:9001'
    volumes:
      - ojplatform-minio-data:/data
    networks: [ojplatform-local]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  ojplatform-local:
    name: ojplatform-local

volumes:
  ojplatform-postgres-data:
    name: ojplatform-postgres-data
  ojplatform-redis-data:
    name: ojplatform-redis-data
  ojplatform-minio-data:
    name: ojplatform-minio-data
