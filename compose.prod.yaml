x-production-logging: &production-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}
      PRODUCT_RUNTIME_DB_PASSWORD: ${PRODUCT_RUNTIME_DB_PASSWORD:?PRODUCT_RUNTIME_DB_PASSWORD must be set for production}
    logging: *production-logging
    restart: unless-stopped

  redis-acl-bootstrap:
    environment:
      REDIS_ADMIN_USERNAME: ${REDIS_ADMIN_USERNAME:?REDIS_ADMIN_USERNAME must be set for production}
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:?REDIS_ADMIN_PASSWORD must be set for production}
      REDIS_PRODUCT_USERNAME: ${REDIS_PRODUCT_USERNAME:?REDIS_PRODUCT_USERNAME must be set for production}
      REDIS_PRODUCT_PASSWORD: ${REDIS_PRODUCT_PASSWORD:?REDIS_PRODUCT_PASSWORD must be set for production}
      REDIS_JUDGE_USERNAME: ${REDIS_JUDGE_USERNAME:?REDIS_JUDGE_USERNAME must be set for production}
      REDIS_JUDGE_PASSWORD: ${REDIS_JUDGE_PASSWORD:?REDIS_JUDGE_PASSWORD must be set for production}
      REDIS_WORKER_USERNAME: ${REDIS_WORKER_USERNAME:?REDIS_WORKER_USERNAME must be set for production}
      REDIS_WORKER_PASSWORD: ${REDIS_WORKER_PASSWORD:?REDIS_WORKER_PASSWORD must be set for production}
      REDIS_HEALTH_USERNAME: ${REDIS_HEALTH_USERNAME:?REDIS_HEALTH_USERNAME must be set for production}
      REDIS_HEALTH_PASSWORD: ${REDIS_HEALTH_PASSWORD:?REDIS_HEALTH_PASSWORD must be set for production}

  redis:
    environment:
      REDIS_HEALTH_USERNAME: ${REDIS_HEALTH_USERNAME:?REDIS_HEALTH_USERNAME must be set for production}
      REDIS_HEALTH_PASSWORD: ${REDIS_HEALTH_PASSWORD:?REDIS_HEALTH_PASSWORD must be set for production}
    ports:
      - '127.0.0.1:${OJPLATFORM_REDIS_WORKER_PORT:-6379}:6379'
    logging: *production-logging
    restart: unless-stopped

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set for production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set for production}
    logging: *production-logging
    restart: unless-stopped

  minio-bootstrap:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set for production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set for production}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set for production}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set for production}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET must be set for production}

  migrate-product:
    environment:
      DATABASE_URL: ${PRODUCT_MIGRATION_DATABASE_URL:?PRODUCT_MIGRATION_DATABASE_URL must be set for production}

  api:
    environment:
      DATABASE_URL: ${PRODUCT_RUNTIME_DATABASE_URL:?PRODUCT_RUNTIME_DATABASE_URL must be set for production}
      REDIS_URL: redis://${REDIS_PRODUCT_USERNAME:?REDIS_PRODUCT_USERNAME must be set for production}:${REDIS_PRODUCT_PASSWORD:?REDIS_PRODUCT_PASSWORD must be set for production}@redis:6379/0
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set for production}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set for production}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET must be set for production}
      JUDGE_SERVICE_TOKEN: ${JUDGE_SERVICE_TOKEN:?JUDGE_SERVICE_TOKEN must be set for production}
      JUDGE_ARTIFACT_READ_TOKEN: ${JUDGE_ARTIFACT_READ_TOKEN:?JUDGE_ARTIFACT_READ_TOKEN must be set for production}
      REAL_SUBMISSION_EXECUTION: 'true'
    ports:
      - '127.0.0.1:${OJPLATFORM_API_INTERNAL_PORT:-3010}:3010'
    logging: *production-logging
    restart: unless-stopped

  web:
    ports:
      - '${OJPLATFORM_WEB_PORT:-8080}:8080'
    logging: *production-logging
    restart: unless-stopped

  judge-bootstrap:
    environment:
      JUDGE_DATABASE_ADMIN_URL: ${JUDGE_DATABASE_ADMIN_URL:?JUDGE_DATABASE_ADMIN_URL must be set for production}
      JUDGE_DATABASE_PASSWORD: ${JUDGE_DATABASE_PASSWORD:?JUDGE_DATABASE_PASSWORD must be set for production}

  migrate-judge:
    environment:
      JUDGE_DATABASE_URL: ${JUDGE_MIGRATION_DATABASE_URL:?JUDGE_MIGRATION_DATABASE_URL must be set for production}

  judge-service:
    environment:
      JUDGE_DATABASE_URL: ${JUDGE_RUNTIME_DATABASE_URL:?JUDGE_RUNTIME_DATABASE_URL must be set for production}
      JUDGE_REDIS_URL: redis://${REDIS_JUDGE_USERNAME:?REDIS_JUDGE_USERNAME must be set for production}:${REDIS_JUDGE_PASSWORD:?REDIS_JUDGE_PASSWORD must be set for production}@redis:6379/0
      JUDGE_SERVICE_TOKEN: ${JUDGE_SERVICE_TOKEN:?JUDGE_SERVICE_TOKEN must be set for production}
      JUDGE_NODE_TOKEN: ${JUDGE_NODE_TOKEN:?JUDGE_NODE_TOKEN must be set for production}
    ports:
      - '127.0.0.1:${OJPLATFORM_JUDGE_SERVICE_PORT:-3100}:3100'
    logging: *production-logging
    restart: unless-stopped
