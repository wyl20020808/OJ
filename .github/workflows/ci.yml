name: OJPlatform CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: plugins/OnlineCodeEditor
        run: npm ci
      - run: pnpm infra:up
      - run: pnpm infra:wait
      - run: pnpm db:migrate
      - run: pnpm ci:check
      - run: pnpm integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: always()
        run: pnpm infra:down
